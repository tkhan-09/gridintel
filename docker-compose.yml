version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: gridintel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/03_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gridintel_net

  redis:
    image: redis:7-alpine
    container_name: gridintel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gridintel_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gridintel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    networks:
      - gridintel_net

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: gridintel_ocr
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./ocr-service:/app
      - ocr_temp:/app/temp
    networks:
      - gridintel_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gridintel_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_OCR_URL: http://localhost:8001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - gridintel_net

  arq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gridintel_worker
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    networks:
      - gridintel_net

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  ocr_temp:

networks:
  gridintel_net:
    driver: bridge
